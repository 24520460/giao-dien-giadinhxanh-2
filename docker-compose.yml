services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giadinhxanh-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      # Mount persistent local SQL JSON store so state survives container rebuilds
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional local auxiliary mock email service (Mailpit) for dev notifications
  mailpit:
    image: axllent/mailpit:latest
    container_name: giadinhxanh-mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP Server
    restart: unless-stopped
