<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gia Đình Xanh · Đặt Lịch Dịch Vụ Chăm Sóc Nhà Cửa Tại Gia</title>
  <meta name="description" content="Nền tảng đặt lịch dọn dẹp nhà cửa theo giờ, tổng vệ sinh căn hộ, vệ sinh máy lạnh, giặt sofa và nấu ăn gia đình tại TP.HCM.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view-mode="user">

  <!-- WARM MINIMALISM APP SHELL -->
  <div class="framed-shell" id="appRoot">

    <!-- STICKY HEADER: Centered .site-container in User Mode, Full-Width in Dev Mode -->
    <header class="shell-topbar site-header" role="banner" data-ui="true">
      <div class="topbar-inner site-container">
        <div class="brand-cluster">
          <a href="#1.1" class="brand-logo" onclick="GDXApp.goHomeByRole(); return false;" aria-label="Gia Đình Xanh - Trang chủ">
            <span class="logo-mark" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
                <rect width="28" height="28" rx="8" fill="#1B4332"/>
                <path d="M8 14.5L14 9.5L20 14.5V20.5C20 21.0523 19.5523 21.5 19 21.5H9C8.44772 21.5 8 21.0523 8 20.5V14.5Z" stroke="#F8F9FA" stroke-width="1.75" stroke-linejoin="round"/>
                <path d="M14 17.5C15.3807 17.5 16.5 16.3807 16.5 15C16.5 13.6193 14 11.5 14 11.5C14 11.5 11.5 13.6193 11.5 15C11.5 16.3807 12.6193 17.5 14 17.5Z" fill="#E07A5F"/>
              </svg>
            </span>
            <span class="logo-text brand-title">Gia Đình Xanh</span>
          </a>
        </div>

        <!-- REAL USER NAVIGATION (Shown in 'user' mode) -->
        <nav class="portal-switcher user-main-nav" id="userMainNav" data-ui="true" aria-label="Điều hướng chính">
          <!-- Populated dynamically by app.js based on active role -->
        </nav>

        <!-- DEV 4-PORTAL SWITCHER (Shown only in 'dev' mode) -->
        <nav class="portal-switcher dev-only-el" id="devPortalSwitcher" data-ui="true" aria-label="Chuyển đổi 4 phân hệ">
          <button type="button" class="portal-tab" data-portal="0" aria-selected="false" onclick="GDXApp.switchPortal(0)">
            Phân hệ 0 · Xác thực (5)
          </button>
          <button type="button" class="portal-tab" data-portal="1" aria-selected="true" onclick="GDXApp.switchPortal(1)">
            Phân hệ 1 · Khách hàng (11)
          </button>
          <button type="button" class="portal-tab" data-portal="2" aria-selected="false" onclick="GDXApp.switchPortal(2)">
            Phân hệ 2 · Đối tác Thợ (9)
          </button>
          <button type="button" class="portal-tab" data-portal="3" aria-selected="false" onclick="GDXApp.switchPortal(3)">
            Phân hệ 3 · Quản trị Admin (9)
          </button>
        </nav>

        <!-- Header Right: Location Pill + Role Switcher + Provider Status + Mode Switcher -->
        <div class="topbar-right header-actions" data-ui="true">
          <!-- Component 2.5: Thanh trạng thái Nhận việc & Tọa độ (khi là Thợ) -->
          <div class="provider-header-widget" id="providerHeaderWidget" style="display:none;" title="Trạng thái nhận việc & tọa độ">
            <button type="button" class="online-switch-btn" id="toggleOnlineBtn" onclick="GDXApp.toggleProviderOnline()">
              <span class="status-dot is-online" id="providerOnlineDot"></span>
              <span id="providerOnlineLabel">Đang nhận việc</span>
            </button>
            <button type="button" class="gps-coord-btn" id="updateGpsBtn" onclick="GDXApp.refreshProviderGPS()" title="Cập nhật tọa độ vị trí">
              <span id="providerGpsText">10.73, 106.71</span>
            </button>
          </div>

          <!-- Real User Quick Role Switcher & Account Pill (Shown in 'user' mode) -->
          <div class="user-only-el user-account-bar" id="userAccountBar">
            <label for="userRoleSelect" class="sr-only">Góc nhìn người dùng</label>
            <select id="userRoleSelect" class="user-role-select" onchange="GDXApp.handleUserRoleSwitch(this.value)" title="Chuyển góc nhìn vai trò trong Luồng Người dùng">
              <option value="1" selected>Khách hàng · Minh Thảo</option>
              <option value="2">Đối tác Thợ · Mai Lan</option>
              <option value="3">Quản trị · Quang Hào</option>
              <option value="0">Tài khoản mới</option>
            </select>
          </div>

          <!-- In-app Notification Bell (FR-NOTIF-001) -->
          <button type="button" class="btn btn-secondary btn-sm notif-bell-btn" id="notifBellBtn" onclick="GDXApp.toggleNotificationsDrawer()" aria-label="Thông báo hệ thống" title="Thông báo hệ thống">
            <span class="bell-icon" aria-hidden="true">🔔</span>
            <span class="notif-badge" id="notifBadgeCount" style="display:none;">0</span>
          </button>

          <!-- Dev Controls (Shown only in 'dev' mode) -->
          <button type="button" class="btn btn-secondary btn-sm dev-only-el" id="supabaseStatusBtn" onclick="GDXApp.openSupabaseStatusModal()" title="Kiểm tra kết nối Backend API & cấu hình .env.local">
            <span class="status-dot is-online" id="backendConnDot"></span>
            <span id="backendConnLabel">API · .env.local</span>
          </button>

          <button type="button" class="btn btn-secondary btn-sm dev-only-el dev-catalog-btn" onclick="GDXApp.openScreenCatalogModal()">
            Danh mục 34 UI
          </button>

          <!-- MODE SWITCHER: Luồng Người dùng vs Chế độ Dev -->
          <div class="mode-switch-pill" role="group" aria-label="Chuyển chế độ hiển thị">
            <button type="button" class="mode-switch-btn" id="modeBtnUser" aria-pressed="true" onclick="GDXApp.setViewMode('user')">
              Người dùng
            </button>
            <button type="button" class="mode-switch-btn" id="modeBtnDev" aria-pressed="false" onclick="GDXApp.setViewMode('dev')">
              Dev (34 UI)
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- LEFT SIDEBAR: Dev Contextual Navigation (Shown only in 'dev' mode) -->
    <aside class="shell-sidebar dev-only-el" id="devSidebar" data-ui="true" aria-label="Điều hướng màn hình trong phân hệ">
      <div>
        <div class="sidebar-section-title" id="sidebarPagesHeading">Màn hình chính (Pages)</div>
        <div class="sidebar-nav-list" id="sidebarPageList"></div>
      </div>

      <div id="sidebarModalsSection">
        <div class="sidebar-section-title">Hộp thoại &amp; Ngăn kéo (Modals)</div>
        <div class="sidebar-nav-list" id="sidebarModalList"></div>
      </div>

      <div class="sidebar-footer-box" id="sidebarSchemaSummary">
        <div><strong>PostgreSQL RLS Active</strong></div>
        <div style="margin-top:4px;" id="sidebarCurrentIdentity">auth.uid(): Nguyễn Minh Thảo (customer_id #101)</div>
      </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <main class="shell-sheet" id="mainViewport" role="main" tabindex="-1">
      <!-- Dynamic Screen Content Rendered by app.js -->
    </main>

  </div>

  <!-- NATIVE DIALOG MODAL / DRAWER HOST -->
  <dialog class="modal-dialog" id="appModal" closedby="any" aria-label="Hộp thoại chi tiết">
    <div id="modalInnerContent"></div>
  </dialog>

  <!-- TOAST FEEDBACK -->
  <div class="toast-banner" id="toastBanner" role="status" aria-live="polite" hidden></div>

  <!-- FLOATING AI ASSISTANT BUTTON (FR-AI-001) -->
  <button type="button" class="ai-fab-btn" id="aiFabBtn" onclick="GDXApp.toggleAiDrawer()" aria-label="Trợ lý thông minh AI">
    <span class="ai-fab-sparkle" aria-hidden="true">✨</span>
    <span class="ai-fab-label">Trợ lý AI</span>
  </button>

  <!-- NOTIFICATIONS DRAWER (FR-NOTIF-001) -->
  <aside class="notifications-drawer is-hidden" id="notificationsDrawer" aria-label="Hộp thông báo" hidden style="display:none;">
    <div class="drawer-header notif-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:18px;">🔔</span>
        <strong>Thông báo hệ thống</strong>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="GDXApp.markAllNotificationsRead()" title="Đánh dấu đã đọc tất cả">Đã đọc tất cả</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="GDXApp.toggleNotificationsDrawer(false)" aria-label="Đóng thông báo">✕</button>
      </div>
    </div>
    <div class="notifications-list" id="notificationsList">
      <!-- Populated dynamically by app.js -->
    </div>
  </aside>

  <!-- AI ASSISTANT CHAT DRAWER (FR-AI-001 -> FR-AI-005) -->
  <aside class="ai-chat-drawer is-hidden" id="aiChatDrawer" aria-label="Hộp thoại Trợ lý AI" hidden style="display:none;">
    <div class="drawer-header ai-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="ai-avatar-badge">✨</span>
        <div>
          <strong style="display:block; font-size:15px; color:#fff;">Trợ lý AI Gia Đình Xanh</strong>
          <span style="font-size:12px; opacity:0.88; color:rgba(255,255,255,0.85);">Tư vấn dịch vụ &amp; Đặt lịch thông minh</span>
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" onclick="GDXApp.toggleAiDrawer(false)" style="color:#fff;" aria-label="Đóng hộp chat">✕</button>
    </div>
    <div class="ai-chat-body" id="aiChatBody">
      <!-- Messages rendered dynamically -->
    </div>
    <div class="ai-quick-prompts" id="aiQuickPrompts">
      <!-- Prompt suggestions -->
    </div>
    <form class="ai-chat-footer" onsubmit="event.preventDefault(); GDXApp.sendAiChatMessage();">
      <input type="text" id="aiChatInput" class="ai-input" placeholder="Hỏi giá, dịch vụ, thợ hoặc cách đặt lịch..." autocomplete="off">
      <button type="submit" class="btn btn-primary ai-send-btn" id="aiSendBtn" aria-label="Gửi câu hỏi">Gửi</button>
    </form>
  </aside>

  <!-- SCRIPTS -->
  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/charts.js"></script>
  <script src="db-mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
